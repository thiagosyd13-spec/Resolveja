<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar anúncio - ResolveJá</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .topo {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .topo h2 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button,
        .voltar {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: none;
            font-size: 16px;
        }

        button {
            background: #111827;
            color: white;
        }

        .voltar {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h2>ResolveJá</h2>
    </div>

    <div class="container">

        <div class="card">

            <h1>✏️ Editar anúncio</h1>

            <form method="POST">

                <label>Nome</label>
                <input type="text" name="nome" value="{{ profissional.nome }}" required>

                <label>Serviço</label>
                <input type="text" name="servico" value="{{ profissional.servico }}" required>

                <label>Telefone</label>
                <input type="text" name="telefone" value="{{ profissional.telefone or '' }}">

                <label>Cidade</label>
                <input type="text" name="cidade" value="{{ profissional.cidade or '' }}">

                <label>Descrição</label>
                <textarea name="descricao">{{ profissional.descricao or '' }}</textarea>

                <label>Preço</label>
                <input type="number" step="0.01" name="preco" value="{{ profissional.preco or '' }}">

                <button type="submit">
                    💾 Salvar alterações
                </button>

            </form>

            <a href="/minha-conta" class="voltar">
                ← Voltar para minha conta
            </a>

        </div>

    </div>

</body>
</html>
